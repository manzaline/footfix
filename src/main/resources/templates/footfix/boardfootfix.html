<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <meta th:name="${_csrf.parameterName}" th:content="${_csrf.token}" id="csrfToken">
  <meta name="_csrf_header" th:content="${_csrf.headerName}" id="csrfHeader">
  <link rel="icon" href="favicon.ico">
  <title>경기일정</title>
<!--    <script src="http://code.jquery.com/jquery-3.6.0.min.js"></script>-->
  <!-- Simple bar CSS -->
  <link rel="stylesheet" href="../css/simplebar.css">
  <!-- Fonts CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100;0,200;0,300;0,400;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <!-- Icons CSS -->
  <link rel="stylesheet" href="../css/feather.css">
  <link rel="stylesheet" href="../css/dataTables.bootstrap4.css">
  <!-- Date Range Picker CSS -->
  <link rel="stylesheet" href="../css/daterangepicker.css">
  <!-- App CSS -->
<!--    <link rel="stylesheet" href="css/app-light.css" id="lightTheme" disabled>-->
  <link rel="stylesheet" href="../css/app-dark.css" id="darkTheme">
  <style>
    .active{
      font-weight: bold;
    }
  </style>
</head>
<body class="vertical  dark  ">
  <div class="wrapper">

    <!-- 원본topnav.html의 nav태그가 중복되지 않고 렌더링하면서 이 곳의 nav태그를 완전히 대체한다 -->
    <nav th:replace="~{/nav/topnav :: mytopnav}"></nav>
    <aside th:replace="~{/nav/leftnav :: myleftnav}"></aside>

    <main role="main" class="main-content">
      <div class="container-fluid">
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="row">
              <!-- Small table -->
              <div class="col-md-12 my-4">
<!--                <h2 class="h4 mb-1" th:utext="${userId}"></h2>-->
                <img id="leagueEmblem" src="https://crests.football-data.org/PL.png" alt="프리미어리그" height="60">
                <h2 class="h4 mb-1">프리미어리그</h2>
                <p class="mb-3">프리미어리그 경기일정입니다. 원하시는 경기를 선택하고 알림등록을 하세요!</p>
                <div class="card shadow">
                  <div class="card-body">
                    <div class="toolbar">
                      <form class="form">
                        <div class="form-row">
                          <div class="form-group col-auto mr-auto">
                            <select class="custom-select mr-sm-2" id="inlineFormCustomSelectPref1">
                              <option value="20" >20</option>
                              <option value="40" selected>40</option>
                              <option value="80" >80</option>
<!--                                <option value="">ALL</option>-->
                            </select>
                          </div>
                          <div class="form-group col-auto">
                            <label for="search" class="sr-only">Search</label>
                            <input type="text" class="form-control" id="search" value="" placeholder="Search">
                          </div>

                        </div>
                      </form>
                    </div>
                    <p role="alert" th:if="${scheduleError}">경기 일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>
                    <p th:if="${scheduleError != true and #lists.isEmpty(matches)}">표시할 경기 일정이 없습니다.</p>
                    <table class="table table-borderless table-hover" id="footfix-table">
                      <thead>
                      <tr>
                        <th>경기 일시 (한국시간)</th>
                        <th colspan="2" style="text-align: center">Home</th>
                        <th>Score</th>
                        <th colspan="2" style="text-align: center">Away</th>
                        <th>Status</th>
                        <th></th>
                      </tr>
                      </thead>
                      <tbody id="bodyContainer">
                        <tr th:each="match : ${matches}"
                            th:attr="data-match-id=|fd-${match.id}|,data-reminder-date=${match.reminderDate}">
                          <td th:text="${match.kickoff}"></td>
                          <td class="home-name text-center" th:text="${match.homeTeam?.displayName}"></td>
                          <td class="text-right">
                            <img th:if="${not #strings.isEmpty(match.homeTeam?.crest)}" th:src="${match.homeTeam.crest}"
                                 width="25" height="25" loading="lazy" alt="홈팀 로고">
                          </td>
                          <td class="match-result text-center" th:text="${match.result}"></td>
                          <td class="text-left">
                            <img th:if="${not #strings.isEmpty(match.awayTeam?.crest)}" th:src="${match.awayTeam.crest}"
                                 width="25" height="25" loading="lazy" alt="원정팀 로고">
                          </td>
                          <td class="away-name text-center" th:text="${match.awayTeam?.displayName}"></td>
                          <td th:text="${match.statusLabel}"></td>
                          <td>
                            <div class="custom-control custom-checkbox" th:if="${match.upcoming}">
                              <input type="checkbox" class="custom-control-input" th:id="|reminder-${match.id}|">
                              <label class="custom-control-label" th:for="|reminder-${match.id}|" aria-label="경기 알림 선택"></label>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <div style="text-align: center" id="pagination"></div>
                    <small>Data provided by <a href="https://www.football-data.org/">football-data.org</a></small>
                    <input type="hidden" th:value="${nickName}" id="nickName">
                    <input type="hidden" th:value="${userId}" id="userId">
                    <button type="button" id="saveDatas" class="btn mb-2 btn-primary btn-lg btn-block">알람등록</button>
                  </div>
                </div>
              </div>
            </div> <!-- end section -->
          </div> <!-- .col-12 -->
        </div> <!-- .row -->
      </div> <!-- .container-fluid -->
      <div th:replace="~{/nav/rightnav :: myrightnav}"></div>

    </main> <!-- main -->
  </div> <!-- .wrapper -->

  <script src="../js/jquery.min.js"></script>
  <script src="../js/popper.min.js"></script>
  <script src="../js/moment.min.js"></script>
  <script src="../js/bootstrap.min.js"></script>
  <script src="../js/simplebar.min.js"></script>
  <script src='../js/jquery.stickOnScroll.js'></script>
  <script src="../js/tinycolor-min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/apps.js"></script>

  <script>
    const csrfToken = document.querySelector('#csrfToken').content;
    const csrfHeader = document.querySelector('#csrfHeader').content;
    const bodyContainer = document.querySelector("#bodyContainer");
    const rows = Array.from(bodyContainer.rows);
    const userId = document.querySelector("#userId").value;

    function updateFilter() {
      const query = document.getElementById("search").value.toLowerCase().trim();
      const matches = rows.filter(row =>
        row.querySelector(".home-name").textContent.toLowerCase().includes(query) ||
        row.querySelector(".away-name").textContent.toLowerCase().includes(query));
      rows.forEach(row => row.style.display = "none");
      createPagination(matches, "pagination");
    }

    // 페이징
    function createPagination(rows, container) {
      let pageSize = parseInt(document.querySelector("#inlineFormCustomSelectPref1").value); // select 요소의 값으로 초기화
      let pageCount = Math.ceil(rows.length / pageSize);
      let pagination = document.getElementById(container);
      pagination.innerHTML = ""; /* 모든요소, 즉 페이징 번호를 제거. while문으로 removeChild()로 firstChild를 지워도 됨 */
      for (let i = 1; i <= pageCount; i++) {
        let page = document.createElement("a");
        page.innerText = i;
        page.style.margin = "5px";
        page.style.cursor = "pointer";
        page.addEventListener("click", function () {
          // 현재 페이지 번호를 가져온다.
          let currentPage = parseInt(this.innerText);
          // 행들을 숨기거나 보여준다.
          rows.forEach(row => row.style.display = "none");
          for (let i = (currentPage - 1) * pageSize; i < currentPage * pageSize; i++) {
            if(rows[i]) {
              rows[i].style.display = "";
            }
          }
          // 페이지 번호에 active 클래스를 추가하거나 제거한다.
          pagination.querySelectorAll("a").forEach(a => a.classList.remove("active"));
          this.classList.add("active");
        });
        pagination.appendChild(page);
      };
      // 첫 번째 페이지 번호를 클릭한다.
      pagination.firstElementChild?.click();
    }

    document.getElementById("search").addEventListener("input", updateFilter);
    document.getElementById("inlineFormCustomSelectPref1").addEventListener("change", updateFilter);
    updateFilter();

    // 경기 데이터는 이미 페이지에 있다. 푸시 토큰은 알림 등록을 눌렀을 때만 조회한다.
    const saveButton = document.getElementById("saveDatas");
    async function post(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json", [csrfHeader]: csrfToken},
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response;
    }

    saveButton.addEventListener("click", async () => {
      const selected = Array.from(bodyContainer.querySelectorAll("input:checked"));
      if (selected.length === 0) {
        alert("알림을 받을 경기를 선택해 주세요.");
        return;
      }
      const datas = selected.map(input => {
        const row = input.closest("tr");
        return [userId, row.dataset.matchId, row.dataset.reminderDate,
          row.querySelector(".home-name").textContent, row.querySelector(".away-name").textContent].join(",");
      });
      saveButton.disabled = true;
      try {
        const tokens = await post(`/notification/getToken/${userId}`);
        const tokenList = await tokens.json();
        if (tokenList.length > 0) {
          // 스케줄러는 이미 DB에 저장된 경기 ID는 건너뛴다.
          await post(`/notification/schedule/${userId}`, {
            tokenList, datas, image: document.getElementById("leagueEmblem").src
          });
        }
        const saved = await post(`/footfix/saveDate/${userId}`, {
          nickName: document.querySelector("#nickName").value, datas
        });
        alert(await saved.text());
      } catch (error) {
        alert("경기 알림을 등록하지 못했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>

</body>
</html>
